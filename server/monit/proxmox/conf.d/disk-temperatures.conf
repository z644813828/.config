check program disk_temperature_warning with path "/usr/bin/python3 /etc/monit/scripts/check_disk_temperatures.py --level warning"
    with timeout 120 seconds
    every 2 cycles
    if status > 0 for 2 cycles then alert

check program disk_temperature_critical with path "/usr/bin/python3 /etc/monit/scripts/check_disk_temperatures.py --level critical"
    with timeout 120 seconds
    every 2 cycles
    if status > 0 then alert
