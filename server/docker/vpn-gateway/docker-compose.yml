# Proxmox only. Review existing docker inspect before any replacement.
name: proxmox-vpn-gateway
services:
  vpn-gateway:
    image: vpn-gateway:migration
    container_name: vpn-gateway
    restart: unless-stopped
    init: true
    pids_limit: 256
    cap_add: [NET_ADMIN, SYS_MODULE]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.src_valid_mark: '1'
      net.ipv4.ip_forward: '1'
    ports:
      - '192.168.2.250:2023:22'
    networks:
      infra_net:
        ipv4_address: 172.30.0.3
    volumes:
      - type: bind
        source: /root/.backup-secrets/proxmox-vpn-gateway/etc/wireguard
        target: /etc/wireguard
        bind:
          create_host_path: false
      - type: bind
        source: /root/.backup-secrets/proxmox-vpn-gateway/root/.ssh
        target: /root/.ssh
        bind:
          create_host_path: false
      - type: bind
        source: /opt/proxmox-vpn-gateway/start-host-forwards
        target: /usr/local/bin/start-host-forwards
        read_only: true
        bind:
          create_host_path: false
    command: [bash, -lc, 'service ssh start && /usr/local/bin/start-vpn-gateway && exec sleep infinity']
networks:
  infra_net:
    external: true
