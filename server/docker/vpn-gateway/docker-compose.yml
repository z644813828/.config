# Reference only.
#
# The current Debian 11 Docker host has docker-compose 1.8.0, which does not
# support all required runtime options for this container. Use docker-run.sh on
# that host.

version: "2.4"

services:
  vpn-gateway:
    image: vpn-gateway-debian11-wireguard
    container_name: vpn-gateway
    restart: unless-stopped
    init: true
    pids_limit: 256
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    ports:
      - "2023:22"
    networks:
      infra_net:
        ipv4_address: 172.30.0.3
    command:
      - bash
      - -lc
      - service ssh start; /usr/local/bin/start-vpn-gateway; tail -f /dev/null

networks:
  infra_net:
    external: true
