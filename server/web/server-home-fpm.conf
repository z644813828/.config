[server-home]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-server-home.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
chdir = /var/www/server-home
clear_env = yes
security.limit_extensions = .php
