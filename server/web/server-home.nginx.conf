server {
    listen 80;
    listen [::]:80;
    server_name server.example.invalid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 302 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name server.example.invalid;
    root /var/www/server-home;
    index index.php;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/server.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.example.invalid/privkey.pem;

    location = /openmediavault.php {
        return 302 https://$host:8444/;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm-server-home.sock;
    }
    location = /apcupsd.php {
        include /etc/nginx/snippets/allowlists.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/apcupsd.php;
        fastcgi_pass unix:/run/php/php8.4-fpm-server-home.sock;
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.php {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
