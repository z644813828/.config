unbind C-b
set -g prefix `
bind-key ` send-prefix

# Set tmux to Vi mode
set-window-option -g mode-keys vi

# --- Terminal -----------------------------------------------------------------
set -g default-terminal "tmux-256color"

# Опции ниже появились в разных версиях tmux; на старых (Debian 11 — 3.1c)
# они пропускаются, чтобы конфиг грузился без ошибок.
%if "#{>=:#{version},3.2}"
# Возможности внешнего терминала (iTerm2/kitty по ssh с мака):
# truecolor, OSC 52 буфер обмена, гиперссылки, подчёркивания, расширенные клавиши.
set -as terminal-features ",xterm*:RGB:clipboard:hyperlinks:usstyle:extkeys"
set -as terminal-features ",xterm-kitty:RGB:clipboard:hyperlinks:usstyle:extkeys"
# Shift+Enter / Ctrl+Enter и прочие модификаторы доходят до Claude Code.
set -s extended-keys on
%else
# tmux < 3.2: truecolor и OSC 52 через terminal-overrides.
set -as terminal-overrides ",xterm*:RGB:Ms=\\E]52;%p1%s;%p2%s\\007"
set -as terminal-overrides ",xterm-kitty:RGB:Ms=\\E]52;%p1%s;%p2%s\\007"
%endif
%if "#{>=:#{version},3.3}"
# OSC-последовательности приложений (уведомления, картинки) проходят наружу.
set -g allow-passthrough on
%endif
%if "#{>=:#{version},3.5}"
set -s extended-keys-format csi-u
%endif

# Копирование (y в copy-mode, выделение мышью, /copy в Claude Code) уходит
# через OSC 52 в буфер обмена мака, даже по ssh.
set -s set-clipboard on

# Фокус окна — для nvim autoread и TUI, которые реагируют на фокус.
set -g focus-events on

# 0 ломает Alt-последовательности при задержках ssh, 10 мс незаметно.
set -sg escape-time 10

# Длинные ответы Claude Code и логи сборок.
set -g history-limit 100000

# Включить мышь: скролл, выделение, клики (Claude Code использует mouse-events)
set -g mouse on

# --- Sessions / windows -------------------------------------------------------
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Подключение одновременно с ноутбука и с мака: размер по последнему активному клиенту.
set -g window-size latest
setw -g aggressive-resize on

# При закрытии последнего окна сессии переключиться на другую, а не отключаться.
set -g detach-on-destroy off

# Заголовок вкладки iTerm: хост, сессия и окно.
set -g set-titles on
set -g set-titles-string "#h: #S / #W"

# Имя окна — текущая папка: видно, в каком проекте какой Claude.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# Колокольчик Claude Code (ждёт ответа / закончил) подсвечивает окно в статусе.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# --- Bindings -----------------------------------------------------------------
# Windows navigation
bind t new-window -c "#{pane_current_path}"
bind ] previous-window
bind [ next-window
bind r last-window      # Go to recent window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Сплиты в текущей папке.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Copy-mode: v — выделение, C-v — блок, y — копировать в буфер мака.
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status (Nord) ------------------------------------------------------------
set -g status-interval 5
set -g status-style "fg=#D8DEE9,bg=#2E3440"
set -g status-left "#[fg=#2E3440,bg=#81A1C1] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#4C566A]#{?client_prefix,#[fg=#EBCB8B]PREFIX ,}#[fg=#D8DEE9]#h "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=#2E3440,bg=#88C0D0] #I #W "
setw -g window-status-bell-style "fg=#2E3440,bg=#EBCB8B"
set -g pane-border-style "fg=#3B4252"
set -g pane-active-border-style "fg=#81A1C1"
set -g message-style "fg=#2E3440,bg=#88C0D0"
setw -g mode-style "fg=#2E3440,bg=#88C0D0"
