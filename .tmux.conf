unbind C-b
set -g prefix `
bind-key ` send-prefix

# Set tmux to Vi mode
set-window-option -g mode-keys vi

set -g default-terminal "tmux-256color"
# Truecolor (RGB) passthrough — нужно Claude Code и другим TUI
set -ag terminal-overrides ",*256col*:RGB,xterm-256color:RGB"

# Включить мышь: скролл, выделение, клики (Claude Code использует mouse-events)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Disable escape waiting
set -sg escape-time 0
# Windows navigation
bind t new-window
bind ] previous-window
bind [ next-window
bind r last-window      # Go to recent window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
